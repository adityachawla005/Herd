[project]
name = "herd"
version = "0.1.0"
description = "Local LLM hardware profiler, optimization advisor, and multi-agent orchestrator"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "websockets>=12",
    "nvidia-ml-py>=12.535; platform_system != 'Darwin'",
]

[project.optional-dependencies]
# Backends beyond Ollama are optional: none of them are needed to profile a machine.
hf = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43",
      "huggingface-hub>=0.24"]
llamacpp = ["llama-cpp-python>=0.3", "huggingface-hub>=0.24"]
all = ["herd[hf,llamacpp]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herd"]
